name: Deploy QA build (gh-pages)

# Every push to main builds the game and publishes it to the gh-pages branch,
# which GitHub Pages serves at the same permanent URL.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npm run build
      - run: touch dist/.nojekyll
      # QA: automatic screenshots of every screen, published with the build at dist/qa/
      - name: QA screenshots
        continue-on-error: true
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          (npx vite preview --port 4173 --strictPort &) ; npx -y wait-on@8 -t 60000 http://localhost:4173/
          QA_OUT=dist/qa node scripts/qa-screenshots.mjs
      - name: Publish dist to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "QA build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Refresh jsDelivr cache for QA screenshots
        continue-on-error: true
        run: |
          for f in README.md index.html build.json $(ls dist/qa | grep jpg); do
            curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@gh-pages/qa/$f" > /dev/null
          done
