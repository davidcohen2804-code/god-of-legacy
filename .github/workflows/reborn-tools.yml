name: REBORN tools (Godot for the dev container)

# GOD OF LEGACY — REBORN. Puts the official Godot editor (Linux x86_64, split into parts) and its single-threaded Web
# export templates on a hidden ref, refs/tools/godot-<version>, so the development container — which reaches GitHub
# only over git — can import, test and export the project locally. Runs when this file changes on the reborn branch.
on:
  push:
    branches: [reborn]
    paths: ['.github/workflows/reborn-tools.yml']

permissions:
  contents: write

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V: 4.7.2
    steps:
      - name: Download Godot (official release) and check its sums
        run: |
          base=https://github.com/godotengine/godot/releases/download/${V}-stable
          curl -fsSL -O "$base/Godot_v${V}-stable_linux.x86_64.zip"
          curl -fsSL -O "$base/Godot_v${V}-stable_export_templates.tpz"
          if curl -fsSL -O "$base/SHA512-SUMS.txt"; then
            grep -E "Godot_v${V}-stable_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          else echo "(no SHA512-SUMS.txt in the release)"; fi
      - name: Pack them onto refs/tools/godot-${{ env.V }}
        run: |
          mkdir out && cd out
          unzip -q ../Godot_v${V}-stable_linux.x86_64.zip
          mv Godot_v${V}-stable_linux.x86_64 godot
          split -b 40m -d -a 2 godot godot.part.
          rm godot
          unzip -q ../Godot_v${V}-stable_export_templates.tpz 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' 'templates/version.txt'
          curl -fsSL -o LICENSE.txt "https://raw.githubusercontent.com/godotengine/godot/${V}-stable/LICENSE.txt"
          curl -fsSL -o COPYRIGHT.txt "https://raw.githubusercontent.com/godotengine/godot/${V}-stable/COPYRIGHT.txt"
          sha256sum godot.part.* templates/* > SHA256SUMS
          ls -la . templates
          git init -q && git checkout -q -b tools
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Godot ${V}-stable: Linux editor (split in parts) and the Web single-threaded export templates, from the official release"
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f "$url" HEAD:refs/tools/godot-${V} || git push -f "$url" HEAD:refs/heads/tools/godot-${V}
