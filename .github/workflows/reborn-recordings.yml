name: REBORN review recordings (onto the reborn-rec-out branch)

# The review's recordings by themselves (reborn/tools/record_review.sh): how it plays in the Android phone's shape with
# the thumbs drawn, and the branches from the side — without the web export or the browser test, so they come back in
# minutes instead of an hour. Run it by pushing the commit to record to the reborn-rec branch (or by hand); the videos
# land on the reborn-rec-out branch (fetched with git: a run's artifact is not reachable from everywhere). The full build
# (reborn-pages.yml) records them too, on every push to reborn.
on:
  push:
    branches: [reborn-rec]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reborn-recordings
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot
        with:
          path: ~/godot
          key: godot-${{ env.V }}-linux-editor
      - name: Godot (official release, the editor only)
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -O "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q Godot_v${V}-stable_linux.x86_64.zip && mv Godot_v${V}-stable_linux.x86_64 godot && rm -f ./*.zip
      - name: Import
        run: ~/godot/godot --headless --path reborn --import
      - name: Unit tests (their outcome is reported at the end; the recordings are made either way)
        id: tests
        continue-on-error: true
        run: ~/godot/godot --headless --path reborn -s res://tests/run_tests.gd
      - name: The recordings (Movie Maker at a fixed 30 fps, software OpenGL under Xvfb)
        run: |
          python3 -m venv "$RUNNER_TEMP/ff" && "$RUNNER_TEMP/ff/bin/pip" install -q imageio-ffmpeg==0.6.0
          FF=$("$RUNNER_TEMP/ff/bin/python" -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          bash reborn/tools/record_review.sh out "$FF"
          ls -la out
          test -s out/m42c_accept_android.mp4
      - name: The videos onto the reborn-rec-out branch (each run's set replaces the last; the history keeps them)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898+github-actions[bot]@users.noreply.github.com"
          P="$RUNNER_TEMP/pub" && mkdir -p "$P" && cd "$P" && git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin reborn-rec-out; then git checkout -q -b out FETCH_HEAD; else git checkout -q --orphan out; fi
          git rm -rq --ignore-unmatch . && cp "$GITHUB_WORKSPACE"/out/* .
          git add -A && git commit -qm "REBORN review recordings of ${GITHUB_SHA::7}" && git push -q origin HEAD:reborn-rec-out
      - name: Fail when the unit tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
