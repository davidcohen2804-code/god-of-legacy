name: REBORN web build (gh-pages/reborn)

# GOD OF LEGACY — REBORN (reborn/, Godot 4, Compatibility renderer, single-threaded Web export so it runs from plain
# static hosting and on mobile Safari without cross-origin isolation). Every push to the reborn branch that touches the
# project imports it, runs its headless logic tests, exports it and publishes it into gh-pages/reborn — only that
# folder; the game at the site's root is untouched (main's deploy keeps reborn/ in place).
on:
  push:
    branches: [reborn]
    paths: ['reborn/**', '.github/workflows/reborn-pages.yml']

permissions:
  contents: write

concurrency:
  group: pages-reborn
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04   # (Playwright 1.56 cannot install its browsers on 26.04)
    timeout-minutes: 140
    env:
      V: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: godot
        with:
          path: ~/godot
          key: godot-${{ env.V }}-web-nothreads
      - name: Godot (official release)
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${V}-stable
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -O "$base/Godot_v${V}-stable_linux.x86_64.zip"
          curl -fsSL -O "$base/Godot_v${V}-stable_export_templates.tpz"
          unzip -q Godot_v${V}-stable_linux.x86_64.zip && mv Godot_v${V}-stable_linux.x86_64 godot
          unzip -q Godot_v${V}-stable_export_templates.tpz 'templates/web_nothreads_*' 'templates/version.txt'
          rm -f ./*.zip ./*.tpz
      - name: Import, test, export
        run: |
          d=~/.local/share/godot/export_templates/${V}.stable && mkdir -p "$d" && cp ~/godot/templates/* "$d/"
          G=~/godot/godot
          $G --headless --path reborn --import
          $G --headless --path reborn -s res://tests/run_tests.gd
          mkdir -p build/web
          $G --headless --path reborn --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
          test -s build/web/index.pck
          echo "{\"commit\":\"${GITHUB_SHA::7}\",\"built\":\"$(date -u +%FT%TZ)\"}" > build/web/version.json
          ls -la build/web
      - name: Combat demo video (Godot's Movie Maker at a fixed 30 fps, software OpenGL under Xvfb)
        # The scripted demo (reborn/scripts/qa/demo_driver.gd) drives the touch controls through the engine's input;
        # a fixed frame rate makes the clip smooth however slowly the runner renders.
        id: demo
        continue-on-error: true
        timeout-minutes: 35
        run: |
          mkdir -p build/web/qa
          xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path reborn --rendering-method gl_compatibility \
            --rendering-driver opengl3 --resolution 1280x720 --write-movie "$RUNNER_TEMP/demo.avi" --fixed-fps 30 \
            -- --demo > "$RUNNER_TEMP/demo.log" 2>&1 || true
          tail -n 25 "$RUNNER_TEMP/demo.log"
          test -s "$RUNNER_TEMP/demo.avi"
          # (the runner image has no ffmpeg: the static build inside the imageio-ffmpeg wheel, from PyPI)
          python3 -m venv "$RUNNER_TEMP/ff" && "$RUNNER_TEMP/ff/bin/pip" install -q imageio-ffmpeg==0.6.0
          FF=$("$RUNNER_TEMP/ff/bin/python" -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          # (with its sound: Movie Maker records the game's own mix)
          "$FF" -y -loglevel error -i "$RUNNER_TEMP/demo.avi" -c:v libx264 -pix_fmt yuv420p -crf 24 -preset veryfast \
            -c:a aac -b:a 128k -movflags +faststart build/web/qa/m4d_demo.mp4
          MP4=build/web/qa/m4d_demo.mp4
          # (M4 Stage D) an overview; the whole branch at real speed at 10 frames a second; the missed strike and the
          # expired SEAL at 3; the refused EXECUTE and the Execution that misses at 3; the branch at half speed at 5.5
          "$FF" -y -loglevel error -i $MP4 -vf "fps=0.85,scale=480:-1,tile=6x6" -frames:v 1 build/web/qa/m4d_demo_frames.jpg
          "$FF" -y -loglevel error -ss 3.5 -t 3.4 -i $MP4 -vf "fps=10,scale=480:-1,tile=6x6" -frames:v 1 build/web/qa/m4d_success_frames.jpg
          "$FF" -y -loglevel error -ss 10.0 -t 8.4 -i $MP4 -vf "fps=3,scale=480:-1,tile=6x5" -frames:v 1 build/web/qa/m4d_failed_a_frames.jpg
          "$FF" -y -loglevel error -ss 20.5 -t 9.6 -i $MP4 -vf "fps=3,scale=480:-1,tile=6x5" -frames:v 1 build/web/qa/m4d_failed_b_frames.jpg
          "$FF" -y -loglevel error -ss 33.4 -t 6.4 -i $MP4 -vf "fps=5.5,scale=480:-1,tile=6x6" -frames:v 1 build/web/qa/m4d_slow_frames.jpg
          python3 reborn/tools/pack_png.py $MP4 $MP4.png
          # the integrated M4 review: the three Legacy Chain branches one after another at real speed (overview at 2 fps)
          xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path reborn --rendering-method gl_compatibility \
            --rendering-driver opengl3 --resolution 1280x720 --write-movie "$RUNNER_TEMP/m4.avi" --fixed-fps 30 \
            -- --demo --demo-m4 > "$RUNNER_TEMP/m4.log" 2>&1 || true
          tail -n 15 "$RUNNER_TEMP/m4.log"
          if [ -s "$RUNNER_TEMP/m4.avi" ]; then
            "$FF" -y -loglevel error -i "$RUNNER_TEMP/m4.avi" -c:v libx264 -pix_fmt yuv420p -crf 24 -preset veryfast \
              -c:a aac -b:a 128k -movflags +faststart build/web/qa/m4_review.mp4
            "$FF" -y -loglevel error -i build/web/qa/m4_review.mp4 -vf "fps=2,scale=480:-1,tile=6x7" -frames:v 1 build/web/qa/m4_review_frames.jpg
            python3 reborn/tools/pack_png.py build/web/qa/m4_review.mp4 build/web/qa/m4_review.mp4.png
          fi
          ls -la build/web/qa
      - name: The demo and its contact sheets as a run artifact (fetchable before the smoke test ends)
        if: steps.demo.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: |
            build/web/qa/m4d_*.mp4
            build/web/qa/m4d_*.jpg
            build/web/qa/m4_review.mp4
            build/web/qa/m4_review_frames.jpg
          retention-days: 7
      - name: Browser smoke test in Playwright's own image (Chromium as an Android phone and at 16:9, WebKit as an iPhone, all in landscape)
        # Playwright's image carries its browsers and their system libraries: no apt install on the runner (a slow
        # mirror once hung the run, and a killed apt-get kept its lock).
        id: smoke
        continue-on-error: true
        timeout-minutes: 100
        run: |
          img=mcr.microsoft.com/playwright:v1.56.1-noble
          docker pull -q "$img"
          docker run --rm --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp -e OUT=/w/build/web/qa \
            -v "$GITHUB_WORKSPACE:/w" -w /w/reborn/qa "$img" bash -c '
              set -e
              npm i --no-save --no-audit --no-fund playwright@1.56.1 > /dev/null
              (node serve.mjs /w/build/web 8060 &)
              sleep 1
              node smoke.mjs'
      - name: Publish into gh-pages/reborn
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            rm -rf pages && git worktree prune
            git fetch --depth=1 origin gh-pages
            git worktree add -f pages origin/gh-pages
            (cd pages && rm -rf reborn && mkdir reborn && cp -a ../build/web/. reborn/ && git add -A reborn \
              && { git commit -qm "REBORN web build ${GITHUB_SHA::7}" || exit 0; } \
              && git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages) && exit 0
            sleep 7
          done
          exit 1
      - name: Fail when the smoke test failed or could not run (the build and its screenshots are published either way)
        if: steps.smoke.outcome != 'success'
        run: exit 1
